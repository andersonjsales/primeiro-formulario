<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="tituloPrincipal">
            Primeiro Formulario
        </h1>
    </header>
    <main class="principal">
        <form class="formulario">
            <h2 class="tituloFormulario">
                Login
            </h2>
            <div class="caixaCampo">
                <label class="rotuloCampo" for="nomeCampo">
                    Nome
                </label>
                <input type="text" 
                id="nomeCampo" 
                class="campoFormulario"
                placeholder="Digite seu nome...">
            </div>
            <div class="caixaCampo">
                <label class="rotuloCampo" for="emailCampo">
                    Email
                </label>
                <input type="email"
                id="emailCampo"
                class="campoFormulario"
                placeholder="Digite seu email...">
            </div>
            <div class="caixaCampo">
                <label class="rotuloCampo" for="senhaCampo">
                    Senha
                </label>
                <input type="password"
                id="senhaCampo"
                class="campoFormulario"
                placeholder="Digite sua senha">
            </div>
            <button class="btnEnviar">
                Enviar
            </button>
        </form>
    </main>
    
</body>
</html>
